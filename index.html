<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto IMC</title>
    <link rel="stylesheet" href=""> <!--Vincula CSS ao HTML-->
</head>

<body>
    <header>

    </header>

    <main>
        <section>
            <h1>Projeto IMC</h1>
            <h2>Índice de Massa Corporal</h2>
            <p>O Índice de Massa Corporal (IMC), é um calculo usado pela Organização Mundial da Saúde (OMS) para avaliar se o seu corpo está saudável, verificando seu peso e altura.</p>

            <form>
                <div> <!--Campo para adicionar peso-->
                    <label for="peso">Peso</label>
                    <input type="number" id="peso" name="peso" placeholder="Insira seu peso" min="2" max="700" step="0.01">
                </div>
                <div><!--Campo para adicionar altura-->
                    <label for="altura">Altura</label>
                    <input type="number" id="altura" name="altura" placeholder="Insira sua altura" min="0.5" max="3.0" step="0.01">
                </div>
                <button>Calcular IMC</button>
            </form>

        </section>
    </main>

    <footer>
        <p>Aplicativo e Site desenvolvido por:<br>
            Anderson Pedro de Alcântara</p>
    </footer>

    <script></script> <!--Vincula o .JS ao HTML-->
</body>

</html>
